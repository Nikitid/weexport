name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check documentation
        run: sh scripts/check-readme.sh
      - name: Download signed draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --dir dist/release
      - name: Verify release assets and installer payload
        run: python3 scripts/verify-release.py "$GITHUB_REF_NAME" dist/release
      # The draft carries notes built from the source repository's commit subjects.
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *_beta*) gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease ;;
            *) gh release edit "$GITHUB_REF_NAME" --draft=false --latest ;;
          esac
      - name: Keep the verified feed for Pages
        run: mkdir -p site && cp dist/release/appcast.xml site/appcast.xml
      # The Windows feed of the newest windows-* release stays beside the macOS appcast.
      - name: Keep the Windows feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft | not) | .tagName | select(startswith("windows-"))][0] // ""')
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern windows.json --dir site
            python3 -c "import json; f=json.load(open('site/windows.json')); assert f['format'] == 1 and f['items']"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  feed:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4

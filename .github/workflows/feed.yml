name: Feed
# Redeploys the update feeds to GitHub Pages: the macOS appcast of the latest stable
# release and windows.json of the newest Windows release.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download the published feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          gh release download --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir site
          grep -q 'sparkle-signatures' site/appcast.xml
      # The Windows feed of the newest windows-* release stays beside the macOS appcast.
      - name: Keep the Windows feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft | not) | .tagName | select(startswith("windows-"))][0] // ""')
          if [ -n "$tag" ]; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern windows.json --dir site
            python3 -c "import json; f=json.load(open('site/windows.json')); assert f['format'] == 1 and f['items']"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4

name: Feed
# Redeploys the update feed of the latest stable release to GitHub Pages.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download the published feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          gh release download --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir site
          grep -q 'sparkle-signatures' site/appcast.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
